services:
  postgres:
    image: postgres:${AYON_STACK_POSTGRES_TAG:-17}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayon"]
      interval: 5s
      timeout: 5s
      retries: 5

    expose: [5432]

    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "db:/var/lib/postgresql/data"

    environment:
      - "POSTGRES_USER=ayon"
      - "POSTGRES_PASSWORD=ayon"
      - "POSTGRES_DB=ayon"

  redis:
    image: redis:alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

    expose: [6379]


  server:
    image: ynput/ayon:${AYON_STACK_SERVER_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/info"]
      interval: 10s
      timeout: 2s
      retries: 3

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    expose: [5000]
    ports: 
      - ${AYON_STACK_SERVER_PORT:-5000}:5000

    volumes:
      - "./addons:/addons"
      - "./storage:/storage"

      # custom favicons
      - "./custom/favicon.ico:/frontend/favicon.ico"
      - "./custom/favicon-16x16.png:/frontend/favicon-16x16.png"
      - "./custom/favicon-32x32.png:/frontend/favicon-32x32.png"
      - "./custom/apple-touch-icon.png:/frontend/apple-touch-icon.png"

      # comment out the following line on Windows
      - "/etc/localtime:/etc/localtime:ro"

      # uncomment the following line if you need to work on the backend code
      # - "./backend:/backend"
  worker:
    image: ynput/ayon-ash:latest
    hostname: worker01
    restart: unless-stopped
    network_mode: host
    depends_on:
      - server
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    environment:
      - "AYON_API_KEY=57bae03b02974881bde33b500846afac"
      - "AYON_SERVER_URL=http://192.168.0.24:5000"

volumes:
  db: {}
